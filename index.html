<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pausa Bienestar</title>
<meta name="theme-color" content="#157A7E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Diseño: app móvil de bienestar. Portada con degradé verde azulado y "Brote", un compañero que crece con tu práctica.
   Tarjetas claras con sombra suave, barra inferior de 5 lugares con botón central "+" para agregar un síntoma. */
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --surface-2:#E7EEED; --ink:#12242A; --muted:#566B70; --line:#D6E1E0;
  --accent:#157A7E; --accent-ink:#FFFFFF; --accent-soft:#D6EEED;
  --sun:#F0B13E; --sun-ink:#4A3000; --sun-soft:#FFF1D1;
  --care-bg:#FFF1E3; --care-ink:#6B3300; --care-line:#EFC594;
  --m1:#C4585F; --m2:#D98A5B; --m3:#CDB75A; --m4:#7DB58A; --m5:#2E9A8B;
  --q1:#FFF0C7; --q2:#FFE0DE; --q3:#DDF1E2; --q4:#DCE9F7;
  --c-breath:#2F8FC4; --c-med:#2E9A6B; --c-sleep:#6B69BE; --c-cbt:#C98A1E; --c-chat:#D1566A; --c-learn:#157A7E;
  --hero-a:#0D5159; --hero-b:#17868A; --hero-c:#7BCBAA;
  --brote:#8EDDBC; --leaf:#4FB286; --leaf-d:#2F8A64; --bloom:#F4A3B6; --face:#14323A;
  --shadow:0 1px 2px rgba(18,36,42,.06),0 10px 28px rgba(18,36,42,.08);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1619; --surface:#14252A; --surface-2:#1B3238; --ink:#E6F1F0; --muted:#9CB3B6; --line:#27403F;
    --accent:#5CC9CC; --accent-ink:#06191C; --accent-soft:#17383C;
    --sun:#F2C25F; --sun-ink:#FFE2A0; --sun-soft:#3A2D12;
    --care-bg:#33261A; --care-ink:#FFD9AE; --care-line:#5C4126;
    --m1:#D9777E; --m2:#E39C72; --m3:#D6C26A; --m4:#8BC498; --m5:#4DB5A5;
    --q1:#3A3217; --q2:#3C2321; --q3:#1F3727; --q4:#1E3045;
    --c-breath:#6DB8E3; --c-med:#6CC59E; --c-sleep:#9A98E0; --c-cbt:#EDB85A; --c-chat:#EE9AA5; --c-learn:#5CC9CC;
    --hero-a:#093C42; --hero-b:#106A6D; --hero-c:#3E9E86;
    --brote:#7BD1AE; --leaf:#4FB286; --leaf-d:#8FE0B8; --bloom:#F4A3B6; --face:#10282E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1619; --surface:#14252A; --surface-2:#1B3238; --ink:#E6F1F0; --muted:#9CB3B6; --line:#27403F;
  --accent:#5CC9CC; --accent-ink:#06191C; --accent-soft:#17383C;
  --sun:#F2C25F; --sun-ink:#FFE2A0; --sun-soft:#3A2D12;
  --care-bg:#33261A; --care-ink:#FFD9AE; --care-line:#5C4126;
  --m1:#D9777E; --m2:#E39C72; --m3:#D6C26A; --m4:#8BC498; --m5:#4DB5A5;
  --q1:#3A3217; --q2:#3C2321; --q3:#1F3727; --q4:#1E3045;
  --c-breath:#6DB8E3; --c-med:#6CC59E; --c-sleep:#9A98E0; --c-cbt:#EDB85A; --c-chat:#EE9AA5; --c-learn:#5CC9CC;
  --hero-a:#093C42; --hero-b:#106A6D; --hero-c:#3E9E86;
  --brote:#7BD1AE; --leaf:#4FB286; --leaf-d:#8FE0B8; --bloom:#F4A3B6; --face:#10282E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.face{display:block;flex:none}

.app{max-width:520px;margin:0 auto;padding-bottom:130px}
h1{font:700 29px/1.15 var(--font-display);letter-spacing:-.02em;margin:12px 0 8px;text-wrap:balance}
h2{font:700 19px/1.25 var(--font-display);letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance}
h3{font:600 12.5px/1.3 var(--font-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.lead{color:var(--muted);max-width:60ch;margin:0 0 6px}
.fine{font-size:13px;color:var(--muted);margin-top:22px}
.eyebrow{font:600 12.5px/1.2 var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 0}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}
.brand{display:flex;align-items:center;gap:8px;font:700 22px/1 var(--font-display);letter-spacing:-.01em}
.brand svg{width:28px;height:28px;color:var(--accent)}
.top-r{display:flex;align-items:center;gap:8px}
.help-btn{font:600 13.5px/1 var(--font-body);color:var(--care-ink);background:var(--care-bg);border:1px solid var(--care-line);border-radius:999px;padding:9px 12px;cursor:pointer}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 16px var(--font-display);border:0;cursor:pointer;display:grid;place-items:center}

/* Botones y piezas comunes */
.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font:600 16px/1.2 var(--font-body);padding:15px 20px;cursor:pointer;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{display:inline-block;width:auto;padding:10px 16px;font-size:14.5px;border-radius:14px}
.link-btn{background:none;border:0;padding:4px 0;color:var(--accent);font:600 14px var(--font-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link-btn.danger{color:var(--m1)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.banner,.demo{background:var(--surface-2);border-radius:14px;padding:10px 14px;font-size:14px;margin:10px 0 0}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:4px 10px;width:fit-content}
.pill i{width:9px;height:9px;border-radius:50%;display:block}
.pill.sun{background:var(--sun-soft);color:var(--sun-ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12.5px;background:var(--surface-2);border-radius:999px;padding:3px 10px}
.tag.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:15px;cursor:pointer;line-height:1.25}
.chip.sm{padding:6px 11px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip[aria-pressed="true"]::before{content:"\2713\00a0"}
.chip.care{border-color:var(--care-line);background:var(--care-bg);color:var(--care-ink)}
.chip.care[aria-pressed="true"]{background:var(--care-ink);color:var(--care-bg);border-color:var(--care-ink)}
.sub{font-size:13.5px;color:var(--muted);margin:16px 0 8px}
input[type=text],input[type=date],input[type=time],textarea,.inp{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-width:0}
textarea{resize:vertical;min-height:110px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:14px;font-weight:600}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:380px){.two{grid-template-columns:minmax(0,1fr)}}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sec-head h2{margin:0}
.home-sec{margin-top:30px}

/* Portada */
.hero{position:relative;overflow:hidden;color:#fff;border-radius:28px;padding:20px 18px 18px;background:linear-gradient(155deg,var(--hero-a) 0%,var(--hero-b) 58%,var(--hero-c) 135%);box-shadow:var(--shadow);margin-top:6px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.14);pointer-events:none}
.hero::before{width:260px;height:260px;right:-90px;top:-80px}
.hero::after{width:430px;height:430px;right:-180px;top:-170px}
.hero-top{display:flex;gap:6px;align-items:flex-start;position:relative}
.hero-txt{flex:1;min-width:0}
.hero .eyebrow{color:rgba(255,255,255,.75);margin-top:4px}
.hero h1{color:#fff;font-size:31px;margin:6px 0 6px}
.hero-say{margin:0;color:rgba(255,255,255,.88);font-size:15px;max-width:26ch}
.hero-brote{width:116px;flex:none;margin-top:-2px}
.hero-brote svg{width:100%;height:auto;display:block}
.btn.cta{background:#fff;color:var(--hero-a);margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;padding:16px 18px;position:relative}
.btn.cta .plus{font:600 26px/1 var(--font-body);margin-top:-3px}
.hero-stats{display:flex;gap:10px;margin-top:14px;position:relative}
.hs{flex:1;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border-radius:14px;padding:9px 12px;min-width:0}
.hs .ic{width:22px;height:22px;color:#FFD27A}
.hs div{display:flex;flex-direction:column;min-width:0}
.hs b{font:700 15px/1.2 var(--font-display)}
.hs span{font-size:12.5px;color:rgba(255,255,255,.8);line-height:1.2}
.xpbar{height:7px;border-radius:99px;background:rgba(255,255,255,.2);margin-top:12px;overflow:hidden;position:relative}
.xpbar span{display:block;height:100%;background:#FFD27A;border-radius:99px}

/* Misiones */
.quests{padding:6px 10px}
.quest{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:10px 6px;text-align:left;cursor:pointer;border-radius:14px}
.quest + .quest{border-top:1px solid var(--line);border-radius:0}
.quest .qc{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.quest .qc .ic{width:16px;height:16px;stroke-width:3}
.quest.done .qc{background:var(--accent);border-color:var(--accent)}
.quest .qm{flex:1;min-width:0;display:flex;flex-direction:column}
.quest .qm b{font-size:15.5px}
.quest .qm small{color:var(--muted);font-size:13px}
.quest .qx{font-size:12.5px;font-weight:600;color:var(--sun-ink);background:var(--sun-soft);border-radius:999px;padding:3px 9px;flex:none}
.quest.done .qm b{text-decoration:line-through;color:var(--muted)}
.quest:disabled{cursor:default}

/* Carruseles y tarjetas de acción */
.arrows{display:flex;gap:8px}
.arrows button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer;line-height:1;padding:0 0 3px}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 14px;margin:0 -2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.act{flex:0 0 min(70%,236px);scroll-snap-align:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.act-ic{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--c);flex:none}
.act-ic::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--c);opacity:.15}
.act-ic .ic{position:relative}
.act-k{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--c);margin-top:6px}
.act-t{font:700 17px/1.2 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
.act-s{font-size:13.5px;color:var(--muted);flex:1}
.arow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.arow + .arow{margin-top:10px}
.arow .act-ic{width:42px;height:42px}
.arow-m{flex:1;min-width:0;display:flex;flex-direction:column}
.arow-m b{font-size:15.5px;line-height:1.25}
.arow-m small{color:var(--muted);font-size:13px;line-height:1.3}
.arow .ic.chev{width:18px;height:18px;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.gridact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gridact .act{flex:none}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:24px;padding:18px;color:#fff;cursor:pointer;background:linear-gradient(150deg,#C84E66,#E58A7B);box-shadow:var(--shadow)}
.big b{font:700 20px/1.2 var(--font-display);display:block}
.big span{font-size:14px;opacity:.92}
.big .brote-s{width:70px;flex:none}
.big .brote-s svg{width:100%;height:auto;display:block}

/* Semana / progreso */
.chart{display:block;width:100%;height:auto;margin-top:8px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{stroke:var(--surface);stroke-width:2}
.chart text{fill:var(--muted);font:10.5px var(--font-body)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center}
.cal .day{aspect-ratio:1;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;max-width:100%}
.cal .day i{font-style:normal;font-size:11.5px;color:var(--muted)}
.cal .day[style] i{color:#14323A;font-weight:600}
.cal .day.fut{opacity:.35}
.cal .day.today{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span.sw{display:flex;gap:3px}
.legend i{width:14px;height:14px;border-radius:5px;display:block}
.irow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:12px;font-size:14.5px}
.itrack{position:relative;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.itrack::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--bg)}
.ifill{position:absolute;top:0;bottom:0}
.ifill.pos{left:50%;background:var(--accent);border-radius:0 99px 99px 0}
.ifill.neg{right:50%;background:var(--m2);border-radius:99px 0 0 99px}
.iv{font:600 13.5px var(--font-body);min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14.5px}
.bar .track{grid-column:1 / -1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent);border-radius:99px}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px;margin-top:12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11.5px;line-height:1.2}
.badge .bi{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--sun-soft);color:var(--sun-ink)}
.badge.lock{opacity:.4;filter:grayscale(1)}
.entries{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.entry{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.entry .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.entry .row b{display:flex;align-items:center;gap:8px}
.entry p{margin:8px 0 0;font-size:14.5px;color:var(--muted)}

/* Informes y síntomas (detalles) */
details.sym{background:var(--surface);border:1px solid var(--line);border-radius:18px}
details.sym + details.sym{margin-top:10px}
details.sym > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;font:700 17px/1.2 var(--font-display)}
details.sym > summary::-webkit-details-marker{display:none}
details.sym > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;flex:none;margin-right:4px}
details.sym[open] > summary::after{transform:rotate(-135deg)}
.sym-body{padding:0 18px 18px}
.sym-body ul,.sym-body ol,.report ul,.report ol{margin:0 0 6px;padding-left:20px}
.sym-body li,.report li{margin-bottom:6px}
.links{list-style:none;padding:0!important}
.links a{color:var(--accent);font-weight:500}
.when{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:14.5px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.tile.soft{background:var(--accent-soft);border-color:transparent;box-shadow:none}
.tile h2{font-size:17px;margin:0}
.tile p{margin:0;font-size:14.5px;flex:1}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.duo{grid-template-columns:minmax(0,1fr)}}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.todo li{display:flex;gap:12px;align-items:baseline;font-size:15px;min-width:0}
.todo b{font:700 15px var(--font-display);min-width:3.4em;font-variant-numeric:tabular-nums;color:var(--accent)}
.nudge-card{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.nudge-card.strong{background:var(--care-bg);border-color:var(--care-line);color:var(--care-ink)}
.nudge-card.strong h2{color:var(--care-ink)}
.nudge-card p{font-size:14.5px;margin-bottom:12px}
.nc-ic{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.nudge-card.strong .nc-ic{background:var(--care-ink);color:var(--care-bg)}
.care-card{background:var(--care-bg);color:var(--care-ink);border:1px solid var(--care-line);border-radius:20px;padding:18px;margin:16px 0}
.care-card h2{color:var(--care-ink)}
.care-card a{color:inherit}
.lines{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.lines li{display:flex;flex-direction:column;gap:2px}
.lines strong{font:700 22px/1.1 var(--font-display)}
.lines span{font-size:14px}

/* Profesionales */
.pro{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;cursor:pointer;box-shadow:var(--shadow)}
.pro + .pro{margin-top:12px}
.pav{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;font:700 20px var(--font-display);color:var(--c);position:relative}
.pav::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);opacity:.16}
.pav span{position:relative}
.pro-m{flex:1;min-width:0}
.pro-m b{display:block;font-size:16px}
.pro-m small{display:block;color:var(--muted);font-size:13.5px;line-height:1.3}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-size:14.5px;cursor:pointer}

.checkrow{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;margin-top:14px;cursor:pointer}

.when-list{margin:8px 0 0;padding-left:20px}
.when-list li{margin-bottom:6px}

/* Recordatorios */
.rems{display:flex;flex-direction:column;gap:10px}
.rem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--surface-2);border-radius:14px;padding:12px 14px}
.rem.off .rt{color:var(--muted)}
.rem .rt{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.rem .rs{font-size:13px;color:var(--muted)}
.rem .acts{grid-column:2 / -1;display:flex;gap:16px}
.rem input[type=time]{width:auto;padding:8px}
.switch{width:44px;height:26px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;padding:0;flex:none}
.switch span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] span{transform:translateX(18px);background:var(--accent-ink)}
.idea{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14.5px;margin-top:8px}
.idea div{min-width:0}

/* Sonidos */
.snd{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.snd .chip{display:inline-flex;align-items:center;gap:8px}
.snd .chip .ic{width:18px;height:18px}

/* Flujos a pantalla completa */
[hidden]{display:none!important}
.flow{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.flow-in{width:100%;max-width:520px;display:flex;flex-direction:column;min-height:0;padding:0 16px}
.flow-top{display:flex;align-items:center;gap:12px;padding:12px 0}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn .ic{width:20px;height:20px}
.flow-progress{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.flow-progress span{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}
.flow-body{flex:1;min-height:0;overflow:auto;padding:6px 0 24px}
.flow-foot{padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:stretch}
.flow-foot .link-btn{align-self:center}
.flow-title{font:600 13px var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:4px 0 0}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:13px 15px;font-size:16px;cursor:pointer;line-height:1.3}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.moodrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:16px}
.mood2{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 2px 10px;border-radius:18px;border:2px solid transparent;background:var(--surface);cursor:pointer;font-size:12px;color:var(--muted);text-align:center;line-height:1.2;box-shadow:var(--shadow)}
.mood2[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);font-weight:600;transform:translateY(-3px)}
.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.q{border-radius:20px;padding:12px;background:var(--tint)}
.q b{display:block;font-size:12.5px;margin-bottom:8px;line-height:1.25}
.q .chips{gap:6px}
.slider{margin-top:22px}
.slider input[type=range]{width:100%;accent-color:var(--accent)}
.sl-l{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-top:6px}
.sl-l b{font:700 26px var(--font-display);color:var(--ink)}
.res-top{display:flex;align-items:center;gap:12px}
.res-top .brote-s{width:96px;flex:none}
.res-top .brote-s svg{width:100%;height:auto;display:block}
.gain{display:inline-flex;gap:6px;align-items:center;background:var(--sun-soft);color:var(--sun-ink);border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px}
.gains{margin:8px 0 0;font-size:14px;color:var(--muted)}
.done{text-align:center;padding-top:10px}
.done .brote-s{width:150px;margin:0 auto}
.done .brote-s svg{width:100%;height:auto;display:block}
.quote{background:var(--surface-2);border-radius:16px;padding:12px 14px;text-align:left;margin-top:14px;font-size:15px}
.welcome{text-align:center;padding-top:6px}
.welcome .brote-s{width:190px;margin:0 auto}
.welcome .brote-s svg{width:100%;height:auto;display:block}
.vals{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;text-align:left}
.vals li{display:flex;gap:12px;align-items:flex-start}
.vals .act-ic{width:38px;height:38px;border-radius:12px}

/* Respiración y meditación */
.orb{width:250px;height:250px;margin:18px auto;display:grid;place-items:center;position:relative}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed var(--line)}
.orb-core{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--hero-c),var(--hero-b) 55%,var(--hero-a));transform:scale(.55);box-shadow:0 0 60px rgba(30,160,150,.35)}
.center{text-align:center}
.phase{font:700 28px/1.1 var(--font-display)}
.count{font:600 18px var(--font-body);color:var(--muted);min-height:1.5em}
.ringwrap{position:relative;width:220px;height:220px;margin:10px auto}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .rt{position:absolute;inset:0;display:grid;place-items:center;font:700 40px var(--font-display);font-variant-numeric:tabular-nums}
.prompt{min-height:5.2em;font:500 19px/1.4 var(--font-body);text-align:center;margin:8px 0;text-wrap:balance}
.ctrl{display:flex;justify-content:center;gap:14px;margin-top:6px}
.ctrl .icon-btn{width:56px;height:56px}
.ctrl .icon-btn .ic{width:26px;height:26px}

/* Guía conversacional */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.b{max-width:86%;padding:10px 14px;border-radius:20px;font-size:15.5px;line-height:1.45;overflow-wrap:anywhere}
.b.bot{background:var(--surface);align-self:flex-start;border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.b.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:6px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1s infinite}

@keyframes blink{50%{opacity:1}}
.replies{display:flex;flex-wrap:wrap;gap:8px}
.reply{border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:999px;padding:9px 14px;font:600 14.5px var(--font-body);cursor:pointer}
.sendrow{display:flex;gap:8px}
.sendrow .inp{flex:1}
.sendrow .icon-btn{background:var(--accent);color:var(--accent-ink);box-shadow:none;width:48px;height:48px;border-radius:16px}

/* Hojas y avisos */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,15,18,.55);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:520px;background:var(--bg);border-radius:24px 24px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.panel .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{background:var(--surface-2);border:0;border-radius:50%;width:36px;height:36px;font-size:18px;line-height:1;cursor:pointer;color:var(--ink);flex:none}
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.toast{pointer-events:auto;width:100%;max-width:480px;display:flex;gap:12px;align-items:flex-start;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
.toast .ic{width:22px;height:22px;margin-top:2px}
.toast strong{display:block;font-size:14px}
.toast p{margin:2px 0 0;font-size:14.5px}

/* Barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font:500 11.5px var(--font-body);color:var(--muted);cursor:pointer;border-radius:12px;min-width:0}
.tab .ic{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.fab{justify-self:center;width:58px;height:58px;border-radius:50%;border:4px solid var(--surface);background:linear-gradient(150deg,var(--hero-b),var(--hero-a));color:#fff;display:grid;place-items:center;margin-top:-28px;box-shadow:0 8px 20px rgba(13,81,89,.4);cursor:pointer;padding:0}
.fab .ic{width:28px;height:28px;stroke-width:2.2}

@media (prefers-reduced-motion: reduce){.orb-core,.switch span,.flow-progress span,.typing i{transition:none!important;animation:none!important}}
</style>

</head>

    pick('ejercicio',.4); pick('amigos',.35); pick('aire',.4); pick('estudio',.6); pick('comida',.6); pick('pantallas',.45); pick('descanso',.3); pick('familia',.3);

    let m=3.1+(h.includes('ejercicio')?.8:0)+(h.includes('amigos')?.6:0)+(h.includes('aire')?.3:0)-(h.includes('pantallas')?.6:0)+(sleep>=7?.7:-.5)+(r()-.5)*1.1;

function bestStreak(days){
  let best=0,cur=0,prev=null;
  Object.keys(days).sort().forEach(k=>{ cur=(prev&&addDays(prev,1)===k)?cur+1:1; if(cur>best) best=cur; prev=k; });
  return best;
}
function statsOf(act){
  const t=todayStr(), days={};
  act.forEach(a=>{ if(a.type!=='bonus') days[dayKey(a.ts)]=1; });
  let streak=0, d=days[t]?t:addDays(t,-1);
  while(days[d]){ streak++; d=addDays(d,-1); }
  const xp=act.reduce((s,a)=>s+(a.xp||0),0), level=1+Math.floor(xp/120);
  const ta=act.filter(a=>dayKey(a.ts)===t);
  return {streak,best:bestStreak(days),xp,level,stage:Math.min(5,level),into:xp%120,days,
    q:{check:ta.some(a=>a.type==='check'),calm:ta.some(a=>a.type==='breath'||a.type==='meditate'),cbt:ta.some(a=>a.type==='cbt')}};
}

function badgeCtx(entries,act){
  const st=statsOf(act);
  return {entries:entries.length,best:st.best,level:st.level,
    calm:act.filter(a=>a.type==='breath'||a.type==='meditate').length,cbt:act.filter(a=>a.type==='cbt').length,req:S.requests.length};
}
function award(type,xp,meta){
  const before=statsOf(S.activity);
  S.activity.push({ts:Date.now(),type,xp,meta:meta||null});
  const msgs=[], t=todayStr(), mid=statsOf(S.activity);
  if(mid.q.check&&mid.q.calm&&mid.q.cbt&&!S.activity.some(a=>a.type==='bonus'&&dayKey(a.ts)===t)){
    S.activity.push({ts:Date.now(),type:'bonus',xp:20}); msgs.push('Misiones completas: +20 XP');
  }
  const after=statsOf(S.activity);
  if(after.level>before.level) msgs.push('Brote subió al nivel '+after.level);
  const c=badgeCtx(S.entries,S.activity), ids=BADGES.filter(b=>b.ok(c)).map(b=>b.id), seen=S.badges||[];
  ids.forEach(id=>{ if(seen.indexOf(id)<0) msgs.push('Logro: '+BADGES.filter(b=>b.id===id)[0].l); });
  S.badges=ids; save();
  return msgs;
}

/* Brote: compañero original que crece con tu práctica (5 etapas) */
function broteSvg(stage,sleepy,joy){
  const leaf=(x,y,r,s)=>`<path transform="translate(${x} ${y}) rotate(${r}) scale(${s})" d="M0 0C-9 -5 -11 -18 0 -24C11 -18 9 -5 0 0Z" fill="var(--leaf)"/>`;
  const stem=h=>`<path d="M60 46V${46-h}" stroke="var(--leaf-d)" stroke-width="3.5" stroke-linecap="round" fill="none"/>`;
  let top='';
  if(stage<=1) top=leaf(60,46,-30,.85)+leaf(60,46,30,.85);
  else if(stage===2) top=stem(14)+leaf(60,34,-38,1)+leaf(60,34,38,1);
  else if(stage===3) top=stem(24)+leaf(60,36,-42,1)+leaf(60,36,42,1)+leaf(60,22,0,1.05);
  else if(stage===4) top=stem(24)+leaf(60,36,-42,1)+leaf(60,36,42,1)+'<circle cx="60" cy="19" r="7.5" fill="var(--bloom)"/><path d="M56 16q4-4 8 0" stroke="#fff" stroke-opacity=".55" stroke-width="2" fill="none" stroke-linecap="round"/>';
  else { let p=''; for(let i=0;i<6;i++) p+=`<ellipse cx="60" cy="10" rx="5.2" ry="8" fill="var(--bloom)" transform="rotate(${i*60} 60 19)"/>`; top=stem(24)+leaf(60,36,-42,1)+leaf(60,36,42,1)+p+'<circle cx="60" cy="19" r="5" fill="var(--sun)"/>'; }
  const eyes=sleepy
    ?'<path d="M45 70q4 4 8 0M67 70q4 4 8 0" stroke="var(--face)" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
    :'<circle cx="50" cy="69" r="3.6" fill="var(--face)"/><circle cx="70" cy="69" r="3.6" fill="var(--face)"/><circle cx="51.3" cy="67.7" r="1.1" fill="#fff"/><circle cx="71.3" cy="67.7" r="1.1" fill="#fff"/>';
  const mouth=joy?'<path d="M52 79q8 10 16 0Z" fill="var(--face)"/>':'<path d="M53 79q7 6 14 0" stroke="var(--face)" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
  return `<svg viewBox="0 0 120 120" role="img" aria-label="Brote, tu compañero"><ellipse cx="60" cy="108" rx="30" ry="5" fill="#000" opacity=".14"/>${top}<ellipse cx="60" cy="74" rx="36" ry="33" fill="var(--brote)"/><ellipse cx="50" cy="60" rx="16" ry="9" fill="#fff" opacity=".24" transform="rotate(-20 50 60)"/>${eyes}<ellipse cx="42" cy="78" rx="5" ry="3.2" fill="var(--bloom)" opacity=".55"/><ellipse cx="78" cy="78" rx="5" ry="3.2" fill="var(--bloom)" opacity=".55"/>${mouth}${sleepy?'<text x="90" y="46" font-size="14" fill="var(--leaf-d)" font-family="var(--font-display)" font-weight="700">z</text>':''}</svg>`;
}

function topCounts(list,key,n){
  const c={}; list.forEach(e=>(e[key]||[]).forEach(x=>{ c[x]=(c[x]||0)+1; }));
  return Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,n).map(k=>[k,c[k]]);
}
function recentCounts(){
  const cut=Date.now()-7*86400000, c={};
  E().forEach(e=>{ if(e.ts>=cut) (e.symptoms||[]).forEach(s=>{ c[s]=(c[s]||0)+1; }); });
  return c;
}
function recommended(max){
  const out=[], add=id=>{ if(ACT[id]&&id.indexOf('rep:')!==0&&out.indexOf(id)<0) out.push(id); };
  const rc=recentCounts();
  Object.keys(rc).sort((a,b)=>rc[b]-rc[a]).forEach(s=>(REC[s]||[]).forEach(add));
  if(S.event&&S.event.date&&S.event.date>=todayStr()) GOALREC.examen.forEach(add);
  S.goals.forEach(g=>(GOALREC[g]||[]).forEach(add));
  ['breath46','med-breath','cbt-thought','chat','cbt-grat','cbt-worry'].forEach(add);
  return out.slice(0,max||8);
}
function sortedReports(){
  const rc=recentCounts(), soon=!!(S.event&&S.event.date&&S.event.date>=todayStr());
  return REPORTS.map((r,i)=>{
    let sc=0; r.rel.forEach(s=>{ sc+=rc[s]||0; });
    S.goals.forEach(g=>(GOAL_SYM[g]||[]).forEach(s=>{ if(r.rel.indexOf(s)>-1) sc+=2; }));
    if(soon&&r.id==='ansiedad-examen') sc+=3;
    return {r,sc,i};
  }).sort((a,b)=>(b.sc-a.sc)||(a.i-b.i));
}

/* ---------- Gráficos ---------- */
function weekChart(list){
  const W=340,H=190,L=78,R=14,T=14,B=30,pw=W-L-R,ph=H-T-B,y=m=>T+(5-m)/4*ph;
  const pts=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const k=ymd(d), es=list.filter(e=>dayKey(e.ts)===k);
    pts.push({x:L+(6-i)*pw/6,m:es.length?avg(es.map(e=>e.mood)):null,d,today:i===0});
  }
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ánimo de los últimos 7 días"><defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>`;
  MOODS.forEach(mo=>{ s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(mo.v)}" y2="${y(mo.v)}"/><text x="${L-8}" y="${y(mo.v)+3.5}" text-anchor="end">${mo.l}</text>`; });
  const segs=[]; let seg=[];
  pts.forEach(p=>{ if(p.m==null){ if(seg.length) segs.push(seg); seg=[]; } else seg.push(p); });
  if(seg.length) segs.push(seg);
  segs.forEach(sg=>{
    if(sg.length>1){
      const line=sg.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+y(p.m).toFixed(1)).join(' ');
      s+=`<path d="${line} L${sg[sg.length-1].x.toFixed(1)} ${T+ph} L${sg[0].x.toFixed(1)} ${T+ph} Z" fill="url(#gA)"/><path class="line" d="${line}"/>`;
    }
  });
  pts.forEach(p=>{ if(p.m!=null) s+=`<circle class="pt" cx="${p.x.toFixed(1)}" cy="${y(p.m).toFixed(1)}" r="6" style="fill:${MOODS[Math.round(p.m)-1].c}"/>`; });
  pts.forEach(p=>{ s+=`<text x="${p.x.toFixed(1)}" y="${H-9}" text-anchor="middle">${p.today?'hoy':p.d.toLocaleDateString('es-AR',{weekday:'short'}).replace('.','')}</text>`; });
  return s+'</svg>';
}
function calendar(list){
  const by={}; list.forEach(e=>{ (by[dayKey(e.ts)]=by[dayKey(e.ts)]||[]).push(e.mood); });
  const end=new Date(); end.setHours(0,0,0,0);
  const start=new Date(end); start.setDate(end.getDate()-((end.getDay()+6)%7)-28);
  let h='<div class="cal">'+['L','M','X','J','V','S','D'].map(d=>`<span class="dow">${d}</span>`).join('');
  for(let i=0;i<35;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const k=ymd(d), ms=by[k], m=ms?Math.round(avg(ms)):null;
    h+=`<span class="day${d>end?' fut':''}${k===todayStr()?' today':''}"${m?` style="background:${MOODS[m-1].c}"`:''} title="${esc(fmtShort(d.getTime()))}${m?': '+MOODS[m-1].l:''}"><i>${d.getDate()}</i></span>`;
  }
  return h+'</div><div class="legend"><span>Muy mal</span><span class="sw">'+MOODS.map(m=>`<i style="background:${m.c}"></i>`).join('')+'</span><span>Muy bien</span></div>';
}
function insightRows(list){
  const rows=[];
  HABITS.forEach(h=>{
    const w=[],o=[]; list.forEach(e=>((e.habits||[]).indexOf(h.id)>-1?w:o).push(e.mood));
    if(w.length>=3&&o.length>=3) rows.push({label:h.label,d:avg(w)-avg(o)});
  });
  const hi=[],lo=[]; list.forEach(e=>{ if(e.sleep!=null) (e.sleep>=7?hi:lo).push(e.mood); });
  if(hi.length>=3&&lo.length>=3) rows.push({label:'Dormí 7 horas o más',d:avg(hi)-avg(lo)});
  return rows.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,5);
}

/* ---------- Motor de flujos a pantalla completa ---------- */
const Flow={
  cfg:null,i:-1,ans:{},h:{},iv:[],to:[],
  begin(){ this.stop(); this.cfg={}; this.h={}; this.ans={}; $('flow').hidden=false; document.body.classList.add('lock'); },
  stop(){ this.iv.forEach(id=>clearInterval(id)); this.to.forEach(id=>clearTimeout(id)); this.iv=[]; this.to=[]; stopSound(); speakStop(); },
  tick(fn,ms){ const id=setInterval(fn,ms); this.iv.push(id); return id; },
  later(fn,ms){ const id=setTimeout(fn,ms); this.to.push(id); return id; },
  close(){ this.stop(); this.cfg=null; $('flow').hidden=true; document.body.classList.remove('lock'); render(); },
  show(body,foot,o){
    o=o||{};
    $('flowBody').innerHTML=body; $('flowFoot').innerHTML=foot||''; $('flowFoot').hidden=!foot;
    $('flowBar').parentNode.style.visibility=o.bar===false?'hidden':'visible';
    $('flowBack').style.visibility=o.back?'visible':'hidden';
    $('flowClose').style.visibility=(this.cfg&&this.cfg.noClose&&!o.canClose)?'hidden':'visible';
    if(!o.keep) $('flowBody').scrollTop=0;
  },
  progress(p){ $('flowBar').style.width=Math.max(0,Math.min(100,Math.round(p*100)))+'%'; },
  open(cfg){ this.begin(); this.cfg=cfg; this.ans=Object.assign({},cfg.init||{}); this.i=-1; this.go(1); },
  lastIdx(){ const st=this.cfg.steps; let j=st.length-1; while(j>=0&&st[j].skip&&st[j].skip(this.ans)) j--; return j; },
  go(dir){
    const c=this.cfg; if(!c||!c.steps) return;
    let j=this.i+dir;
    while(c.steps[j]&&c.steps[j].skip&&c.steps[j].skip(this.ans)) j+=dir;
    if(j>=c.steps.length){ c.finish(this.ans); return; }
    if(j<0) return;
    this.i=j; this.render();
  },
  valid(){ const s=this.cfg.steps[this.i]; return !s.valid||s.valid(this.ans); },
  refreshNext(){ const b=$('flowNext'); if(b) b.disabled=!this.valid(); },
  rerender(){ const sc=$('flowBody').scrollTop; this.render(true); $('flowBody').scrollTop=sc; },
  render(keep){
    const c=this.cfg, s=c.steps[this.i], a=this.ans, last=this.i===this.lastIdx();
    let h=`<p class="flow-title">${esc(c.title||'')}</p>`;
    if(s.title) h+=`<h1>${esc(s.title)}</h1>`;
    if(s.text) h+=`<p class="lead">${esc(s.text)}</p>`;
    if(s.type==='info') h+=s.html||'';
    else if(s.type==='text') h+=`<div class="field"><textarea data-k="${s.key}" rows="${s.rows||5}" placeholder="${esc(s.placeholder||'')}" aria-label="${esc(s.title||'')}">${esc(a[s.key]||'')}</textarea></div>`;
    else if(s.type==='line') h+=`<div class="field"><input class="inp" type="text" data-k="${s.key}" maxlength="${s.max||40}" placeholder="${esc(s.placeholder||'')}" value="${esc(a[s.key]||'')}" autocomplete="${s.ac||'off'}" aria-label="${esc(s.title||'')}"></div>`;
    else if(s.type==='slider'){
      const v=a[s.key]!=null?a[s.key]:(s.def!=null?s.def:50); a[s.key]=v;
      h+=`<div class="slider"><input type="range" data-k="${s.key}" min="${s.min}" max="${s.max}" step="${s.step||1}" value="${v}" aria-label="${esc(s.title||'')}"><div class="sl-l"><span>${esc(s.minL||'')}</span><b data-out="${s.key}">${v}</b><span>${esc(s.maxL||'')}</span></div></div>`;
    }

    this.progress((this.i+1)/c.steps.length);

};
function wireFlow(){
  const fl=$('flow');
  fl.addEventListener('input',e=>{
    const t=e.target, k=t.getAttribute&&t.getAttribute('data-k'); if(!k) return;
    Flow.ans[k]=t.type==='range'?+t.value:t.value;
    if(t.type==='range'){ const o=fl.querySelector('[data-out="'+k+'"]'); if(o) o.textContent=t.value; }
    Flow.refreshNext();
  });
  fl.addEventListener('click',e=>{
    const b=e.target.closest('button[data-k][data-v]');
    if(b){
      const k=b.dataset.k, v=b.dataset.v;
      if(b.dataset.m==='multi'){ const arr=Flow.ans[k]||[], ix=arr.indexOf(v); if(ix>-1) arr.splice(ix,1); else arr.push(v); Flow.ans[k]=arr; }
      else Flow.ans[k]=(String(Flow.ans[k])===v&&b.dataset.t==='1')?null:v;
      Flow.rerender(); return;
    }
    const f=e.target.closest('[data-fa]');
    if(f){
      const n=f.dataset.fa;
      if(n==='next') Flow.go(1); else if(n==='back') Flow.go(-1); else if(n==='close') Flow.close();
      else if(Flow.h[n]) Flow.h[n](f,e);
    }
  });
}

/* ---------- Audio generado en el dispositivo ---------- */
const SOUNDS=[{id:'lluvia',l:'Lluvia'},{id:'mar',l:'Mar'},{id:'marron',l:'Ruido marrón'},{id:'cuenco',l:'Cuenco'}];
const SND={kind:null,stop:null,limit:0,timer:null,owner:null};
const AU={ctx:null};
function actx(){
  try{
    if(!AU.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AU.ctx=new C(); }
    if(AU.ctx.state==='suspended') AU.ctx.resume();
    return AU.ctx;
  }catch(e){ return null; }
}
function noiseSrc(ctx,type){
  const len=ctx.sampleRate*4, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
  let last=0;
  for(let i=0;i<len;i++){ const w=Math.random()*2-1; if(type==='brown'){ last=(last+0.02*w)/1.02; d[i]=last*3.5; } else d[i]=w; }
  const s=ctx.createBufferSource(); s.buffer=buf; s.loop=true; return s;
}
function bellAt(ctx,dest,t0,f,vol){
  [1,2.76,5.4].forEach((m,i)=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=f*m;
    g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(vol/(i+1),t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+(i?2.2:5));
    o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+5.2);
  });
}
function armSndTimer(){
  if(SND.timer){ clearTimeout(SND.timer); SND.timer=null; }
  if(SND.kind&&SND.limit>0) SND.timer=setTimeout(()=>{ stopSound(); if(TAB==='practice'&&$('flow').hidden) render(); },SND.limit*60000);
}
function startSound(kind,owner){
  stopSound(true);
  const ctx=actx(); if(!ctx){ toast('Sonido no disponible','Tu navegador no permite generar audio acá.'); return; }
  const master=ctx.createGain(); master.gain.setValueAtTime(.0001,ctx.currentTime); master.gain.linearRampToValueAtTime(.7,ctx.currentTime+1.5); master.connect(ctx.destination);
  const nodes=[]; let iv=null;
  if(kind==='lluvia'){
    const n=noiseSrc(ctx,'white'), hp=ctx.createBiquadFilter(), lp=ctx.createBiquadFilter(), g=ctx.createGain();
    hp.type='highpass'; hp.frequency.value=900; lp.type='lowpass'; lp.frequency.value=7500; g.gain.value=.35;
    n.connect(hp); hp.connect(lp); lp.connect(g); g.connect(master); n.start(); nodes.push(n);
  } else if(kind==='mar'){
    const n=noiseSrc(ctx,'brown'), lp=ctx.createBiquadFilter(), g=ctx.createGain(), lfo=ctx.createOscillator(), lg=ctx.createGain();
    lp.type='lowpass'; lp.frequency.value=700; g.gain.value=.55; lfo.frequency.value=.11; lg.gain.value=.35;
    lfo.connect(lg); lg.connect(g.gain); n.connect(lp); lp.connect(g); g.connect(master); n.start(); lfo.start(); nodes.push(n,lfo);
  } else if(kind==='marron'){
    const n=noiseSrc(ctx,'brown'), g=ctx.createGain(); g.gain.value=.8; n.connect(g); g.connect(master); n.start(); nodes.push(n);
  } else if(kind==='cuenco'){
    const ring=()=>bellAt(ctx,master,ctx.currentTime+.05,196,.35); ring(); iv=setInterval(ring,9000);
  }
  SND.kind=kind; SND.owner=owner||'page';
  SND.stop=fast=>{
    if(iv) clearInterval(iv);
    const t=ctx.currentTime;
    try{ master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(Math.max(.0001,master.gain.value),t); master.gain.linearRampToValueAtTime(.0001,t+(fast?.05:1)); }catch(e){}
    setTimeout(()=>{ nodes.forEach(n=>{ try{ n.stop(); }catch(e){} }); try{ master.disconnect(); }catch(e){} },fast?80:1100);
  };
  armSndTimer();
}
function stopSound(fast){
  if(SND.timer){ clearTimeout(SND.timer); SND.timer=null; }
  if(SND.stop){ const f=SND.stop; SND.stop=null; f(fast); }
  SND.kind=null; SND.owner=null;
}
function bell(){ const ctx=actx(); if(!ctx) return; const g=ctx.createGain(); g.gain.value=.8; g.connect(ctx.destination); bellAt(ctx,g,ctx.currentTime+.05,528,.5); }

function openBreath(id){

  Flow.h.dur=el=>{ dur=+el.dataset.v; setup(); };
  Flow.h.start=()=>{
    const total=dur*60, ph=P.ph; let elapsed=0, idx=0, left=0;
    Flow.show(`<div class="center"><p class="flow-title">${esc(P.name)}</p><div class="orb"><div class="orb-core" id="orb"></div></div><div class="phase" id="bPhase">Preparate</div><div class="count" id="bCount"></div></div>`,'<button class="btn ghost" type="button" data-fa="stop">Terminar ahora</button>',{bar:true});
    Flow.progress(0);
    Flow.h.stop=()=>Flow.close();
    const orb=$('orb'); orb.style.transition='none'; orb.style.transform='scale(.55)'; void orb.offsetWidth;
    const next=()=>{
      if(elapsed>=total&&idx%ph.length===0){
        Flow.stop();
        const msgs=award('breath',10,{mins:dur});
        doneScreen({title:'Muy bien',text:`Tomaste ${dur} ${dur===1?'minuto':'minutos'} para vos. ¿Cómo te sentís ahora?`,xp:10,msgs,extra:[['Registrar cómo estoy','checkin']]});

      orb.style.transition=reduce()?'none':`transform ${p[1]}s ease-in-out`; orb.style.transform=`scale(${p[2]})`;
      return true;
    };
    next();
    Flow.tick(()=>{ elapsed++; left--; Flow.progress(Math.min(1,elapsed/total)); if(left<=0){ next(); } else $('bCount').textContent=left+' s'; },1000);
  };
  setup();
}

const fmtT=s=>Math.floor(Math.max(0,s)/60)+':'+pad(Math.max(0,s)%60);
function openMed(id){
  const M=MEDS[id]; let snd='none', voice=VOICE.on;
  Flow.begin(); Flow.cfg={title:'Meditación'};
  const intro=()=>Flow.show(`<div class="center"><p class="flow-title">Meditación</p><h1>${esc(M.title)}</h1><p class="lead" style="margin:0 auto">${esc(M.desc)}</p><p class="muted small">${M.mins} min · guiada</p></div><h3 style="margin-top:22px">Sonido de fondo</h3><div class="chips">${[['none','Ninguno']].concat(SOUNDS.map(s=>[s.id,s.l])).map(s=>`<button class="chip sm" type="button" data-fa="msnd" data-v="${s[0]}" aria-pressed="${snd===s[0]}">${s[1]}</button>`).join('')}</div><label class="checkrow"><input type="checkbox" data-fa="mvoice"${voice?' checked':''}><span>Leerme la guía en voz alta</span></label><p class="muted small" style="margin-top:10px">Podés usar auriculares y cerrar los ojos: al terminar suena una campana.</p>`,'<button class="btn" type="button" data-fa="mstart">Comenzar</button>',{bar:false});
  Flow.h.msnd=el=>{ snd=el.dataset.v; intro(); };
  Flow.h.mvoice=el=>{ voice=el.checked; };
  Flow.h.mstart=()=>{
    VOICE.on=voice; if(snd!=='none') startSound(snd,'flow');
    const total=M.mins*60, per=total/M.prompts.length; let elapsed=0, pi=-1, paused=false;
    Flow.show(`<div class="center"><p class="flow-title">${esc(M.title)}</p><div class="ringwrap"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--surface-2)" stroke-width="8"/><circle id="mRing" cx="60" cy="60" r="54" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3"/></svg><div class="rt" id="mTime">${fmtT(total)}</div></div><p class="prompt" id="mPrompt" aria-live="polite"></p><div class="ctrl"><button class="icon-btn" type="button" id="mPause" data-fa="mpause" aria-label="Pausar">${icon('pause')}</button></div></div>`,'<button class="btn ghost" type="button" data-fa="mend">Terminar ahora</button>',{bar:false});
    const setPrompt=()=>{ const i=Math.min(M.prompts.length-1,Math.floor(elapsed/per)); if(i!==pi){ pi=i; $('mPrompt').textContent=M.prompts[i]; speak(M.prompts[i]); } };
    setPrompt();
    Flow.h.mpause=()=>{ paused=!paused; $('mPause').innerHTML=icon(paused?'play':'pause'); $('mPause').setAttribute('aria-label',paused?'Continuar':'Pausar'); if(paused) speakStop(); };
    Flow.h.mend=()=>Flow.close();
    Flow.tick(()=>{
      if(paused) return;
      elapsed++; $('mTime').textContent=fmtT(total-elapsed); $('mRing').style.strokeDashoffset=(339.3*(1-elapsed/total)).toFixed(1);
      if(elapsed>=total){
        bell(); Flow.stop();
        const msgs=award('meditate',15,{mins:M.mins});
        doneScreen({title:'Listo',text:`Meditaste ${M.mins} minutos. Notá cómo está tu cuerpo ahora.`,xp:15,msgs,extra:[['Registrar cómo estoy','checkin']]});
      } else setPrompt();
    },1000);
  };
  intro();
}

function classify(t){
  const s=t.toLowerCase();
  if(/suicid|matarme|quitarme la vida|no quiero vivir|quiero morir|hacerme da[ñn]o|lastimarme|mejor no estar/.test(s)) return 'serio';
  if(/examen|parcial|final|rendir|prueba/.test(s)) return 'examen';
  if(/dorm|sue[ñn]o|insomnio|desvel/.test(s)) return 'sueno';
  if(/ansie|nervio|p[aá]nico|angustia|miedo/.test(s)) return 'ansioso';
  if(/estr[eé]s|estresad|agobi|presi[oó]n|sobrepasad|desbord/.test(s)) return 'estres';
  if(/triste|llor|deprim|vac[ií]o|desanim/.test(s)) return 'tristeza';
  if(/solo|soledad|aislad/.test(s)) return 'soledad';
  if(/enoj|bronca|furi|irrit/.test(s)) return 'enojo';
  if(/cansad|agotad|sin energ/.test(s)) return 'cansancio';
  if(/pienso|cabeza|rumi|vueltas|pensamient/.test(s)) return 'cabeza';
  if(/bien|content|feliz|tranquil/.test(s)) return 'bien';
  return 'menu';
}

  let busy=false, cur=null;

  const say=(arr,done)=>{
    busy=true; $('chatReplies').innerHTML='';

  const showReplies=reps=>{
    cur=reps;
    $('chatReplies').innerHTML=reps.map((r,i)=>`<button class="reply" type="button" data-fa="creply" data-v="${i}">${esc(r[0])}</button>`).join('');
    toEnd();
  };
  const goNode=id=>{ const n=CHAT[id]||CHAT.menu; say(n.say,()=>showReplies(n.replies||[['Volver al menú','menu'],['Cerrar','@close']])); };
  const target=t=>{
    if(t==='@checkin') openCheckin();
    else if(t==='@help') Sheet.open(helpHtml());
    else if(t==='@close') Flow.close();
    else if(t.indexOf('@act:')===0) runAction(t.slice(5));
    else goNode(t);
  };
  Flow.h.creply=el=>{ if(busy||!cur) return; const r=cur[+el.dataset.v]; if(!r) return; bubble(r[0],'me'); $('chatReplies').innerHTML=''; target(r[1]); };
  Flow.h.csend=()=>{
    if(busy) return; const inp=$('chatIn'), t=inp.value.trim(); if(!t) return;
    inp.value=''; bubble(t,'me'); goNode(classify(t));
  };
  goNode('start');
}

/* ---------- Profesionales: solicitud de turno (demo) ---------- */
function openPro(id){
  PS.id=id; PS.slot=null; PS.note=''; PS.share=true; PS.sent=false;
  Sheet.open(proSheetHtml());
}
function sendPro(){
  const p=PROS.filter(x=>x.id===PS.id)[0]; if(!p||!PS.slot) return;
  S.requests.push({id:Date.now(),ts:Date.now(),pro:p.id,name:p.n,slot:PS.slot,share:PS.share,demo:true});
  award('request',5,{pro:p.id});
  PS.sent=true; Sheet.open(proSheetHtml());
  if(TAB==='pros') render();
}

/* ---------- Recordatorios (solo dentro de la app, mientras está abierta) ---------- */
const IDEAS=[
  {key:'idea-daily',title:'Tu pausa diaria: ¿cómo estás hoy?',time:'20:00',kind:'diario'},
  {key:'idea-breath',title:'Una pausa de respiración de 1 minuto',time:'13:00',kind:'respiracion'},
  {key:'idea-walk',title:'Salir a caminar 10 minutos',time:'17:30',kind:'caminata'},
  {key:'idea-sleep',title:'Bajar el ritmo para dormir: sin pantallas',time:'22:30',kind:'sueno'}
];
function mergeReminders(list){
  const added=[];
  list.forEach(it=>{
    const ex=S.reminders.filter(r=>r.key===it.key)[0];
    if(ex){ if(it.upsert){ const on=ex.on; Object.assign(ex,it); ex.on=on; } return; }
    const r=Object.assign({on:true},it); S.reminders.push(r); added.push(r);
  });
  save(); return added;
}
function remActive(r,d){
  if(r.date) return r.date===d;
  if(r.from&&d<r.from) return false;
  if(r.to&&d>r.to) return false;
  return true;
}
function remDesc(r){
  if(r.date) return (r.date===todayStr()?'Hoy':fmtDay(r.date));
  if(r.from||r.to) return 'Todos los días'+(r.to?' hasta el '+fmtDay(r.to):'');
  return 'Todos los días';
}
function suggestReminders(syms){
  const td=todayStr(), out=[], ev=S.event;
  S.reminders=S.reminders.filter(r=>r.key.indexOf('evt-')!==0||(ev&&ev.date&&ev.date>=td));
  if(ev&&ev.date&&ev.date>=td){
    const nm=ev.name?`«${ev.name}»`:(ev.kind==='presentacion'?'tu presentación':'tu examen');
    out.push({key:'evt-study',upsert:true,title:'Un bloque de estudio para '+nm+' (con una pausa de respiración)',time:'17:00',kind:'estudio',from:td,to:addDays(ev.date,-1)});
    out.push({key:'evt-eve',upsert:true,title:'Mañana es '+nm+': repasá liviano y dormí temprano',time:'20:30',kind:'previo',date:addDays(ev.date,-1)});
    out.push({key:'evt-day',upsert:true,title:'Hoy es '+nm+'. Respirá 1 minuto antes de empezar',time:'08:00',kind:'dia',date:ev.date});
  }
  const has=k=>syms.indexOf(k)>-1;
  if(has('sueno')) out.push({key:'sug-sleep',title:'Bajar el ritmo para dormir: sin pantallas y meditación corta',time:'22:30',kind:'sueno'});
  if(has('ansiedad')||has('estres')||has('abrumo')) out.push({key:'sug-breath',title:'Una pausa de respiración de 1 minuto',time:'13:00',kind:'respiracion'});
  if(has('tristeza')||has('cansancio')||has('soledad')) out.push({key:'sug-walk',title:'Salir a caminar 10 minutos o ver a alguien',time:'17:30',kind:'caminata'});
  return mergeReminders(out);
}
function remindersHtml(){
  if(!S.reminders.length) return '<p class="muted small" style="margin:0">Todavía no tenés recordatorios. Elegí una idea o creá uno propio.</p>';
  return S.reminders.slice().sort((a,b)=>a.time<b.time?-1:(a.time>b.time?1:0)).map(r=>`<div class="rem${r.on?'':' off'}"><button class="switch" type="button" role="switch" aria-checked="${!!r.on}" aria-label="Activar o desactivar" data-x="remtog:${esc(r.key)}"><span></span></button><div><div class="rt">${esc(r.title)}</div><div class="rs">${esc(remDesc(r))}</div></div><input type="time" data-rt="${esc(r.key)}" value="${esc(r.time)}" aria-label="Hora"><div class="acts"><button class="link-btn" type="button" data-x="remtest:${esc(r.key)}">Probar</button><button class="link-btn danger" type="button" data-x="remdel:${esc(r.key)}">Quitar</button></div></div>`).join('');
}
function ideasHtml(){
  const rest=IDEAS.filter(i=>!S.reminders.some(r=>r.key===i.key));
  if(!rest.length) return '<p class="muted small" style="margin:0">Ya agregaste todas las ideas.</p>';
  return rest.map(i=>`<div class="idea"><div>${esc(i.title)} <span class="muted small">· ${i.time}</span></div><button class="btn small" type="button" data-x="idea:${i.key}">Agregar</button></div>`).join('');
}
function refreshRems(){
  const box=document.querySelector('.rems'); if(box) box.innerHTML=remindersHtml();
}
function tick(){
  const n=new Date(), hm=pad(n.getHours())+':'+pad(n.getMinutes()), td=todayStr();
  let ch=false;
  S.reminders.forEach(r=>{
    if(r.on&&r.time===hm&&remActive(r,td)&&r.lastFired!==td){ r.lastFired=td; ch=true; toast('Recordatorio',r.title); }
  });
  if(ch) save();
}

/* ---------- Acciones de la interfaz ---------- */
const X={
  go:a=>go(a),
  checkin:()=>{ Sheet.close(); openCheckin(); },
  act:a=>{ Sheet.close(); runAction(a); },
  help:()=>Sheet.open(helpHtml()),
  close:()=>Sheet.close(),
  scroll:a=>{ const p=a.split(':'), el=$(p[0]); if(el) el.scrollBy({left:(+p[1])*el.clientWidth*.8,behavior:reduce()?'auto':'smooth'}); },
  snd:a=>{ if(SND.kind===a) stopSound(); else startSound(a,'page'); render(); },
  sndlim:a=>{ SND.limit=+a; armSndTimer(); render(); },
  pfs:a=>{ PF.spec=a; render(); },
  pfm:a=>{ PF.mode=a; render(); },
  pro:a=>openPro(a),
  slot:a=>{ PS.slot=a; Sheet.open(proSheetHtml()); },
  slotsend:()=>sendPro(),
  goal:a=>{ const i=S.goals.indexOf(a); if(i>-1) S.goals.splice(i,1); else S.goals.push(a); save(); render(); },
  remadd:()=>{
    const t=($('remTitle').value||'').trim(), tm=$('remTime').value||'20:00';
    if(!t){ toast('Falta el texto','Escribí qué querés que te recuerde.'); return; }
    mergeReminders([{key:'u-'+Date.now(),title:t,time:tm,kind:'propio'}]); render();
  },
  remtog:a=>{ const r=S.reminders.filter(x=>x.key===a)[0]; if(r){ r.on=!r.on; save(); refreshRems(); } },
  remdel:a=>{ S.reminders=S.reminders.filter(x=>x.key!==a); save(); refreshRems(); const i=document.querySelector('.idea'); render(); },
  remtest:a=>{ const r=S.reminders.filter(x=>x.key===a)[0]; if(r) toast('Recordatorio',r.title); },
  idea:a=>{ const i=IDEAS.filter(x=>x.key===a)[0]; if(i){ mergeReminders([i]); render(); } },
  wipeask:()=>{ $('wipeBox').innerHTML='<p class="small" style="margin:0 0 8px">¿Seguro? Se borran tus registros, ejercicios y recordatorios de este navegador.</p><button class="btn small danger" type="button" data-x="wipeyes">Sí, borrar todo</button> <button class="btn small ghost" type="button" data-x="wipeno">Cancelar</button>'; },
  wipeno:()=>render(),
  wipeyes:()=>{
    try{ localStorage.removeItem(KEY); }catch(e){}
    stopSound();
    Object.assign(S,{name:'',goals:[],event:null,onboarded:false,entries:[],activity:[],journal:[],reminders:[],requests:[],badges:[]});
    DEMO=makeDemo(); TAB='home'; render(); scrollTop0(); openOnboarding();
  },
  redo:()=>openOnboarding()
};

document.addEventListener('click',e=>{
  const el=e.target.closest&&e.target.closest('[data-x]'); if(!el) return;
  const v=el.getAttribute('data-x'), i=v.indexOf(':'), verb=i<0?v:v.slice(0,i), arg=i<0?'':v.slice(i+1);
  if(X[verb]){ e.preventDefault(); X[verb](arg,el); }
});
document.addEventListener('input',e=>{
  const t=e.target; if(!t||!t.getAttribute) return;
  const pf=t.getAttribute('data-pf'), ps=t.getAttribute('data-ps');
  if(pf){
    if(pf==='name'){ S.name=t.value.trim().slice(0,30); $('avatar').textContent=(S.name||'?').charAt(0).toUpperCase(); }
    else {
      const ev=S.event||{kind:'examen',name:'',date:''};
      if(pf==='evtName') ev.name=t.value; else ev.date=t.value;
      S.event=(ev.name||ev.date)?ev:null;
    }
    save();
  }
  if(ps==='note') PS.note=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target; if(!t||!t.getAttribute) return;
  const pf=t.getAttribute('data-pf'), ps=t.getAttribute('data-ps'), rt=t.getAttribute('data-rt');
  if(pf==='evtName'||pf==='evtDate'){ suggestReminders([]); refreshRems(); }
  if(ps==='share'){ PS.share=t.checked; Sheet.open(proSheetHtml()); }
  if(rt){ const r=S.reminders.filter(x=>x.key===rt)[0]; if(r&&t.value){ r.time=t.value; r.lastFired=null; save(); } }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(!$('sheet').hidden) Sheet.close();
  else if(!$('flow').hidden&&!(Flow.cfg&&Flow.cfg.noClose)) Flow.close();
});
$('sheet').addEventListener('click',e=>{ if(e.target===$('sheet')) Sheet.close(); });

/* ---------- Inicio ---------- */
load();
if(S.event&&S.event.date&&S.event.date<todayStr()) S.event=null;
DEMO=makeDemo();
buildTabs(); wireFlow(); render();
if(!S.onboarded) openOnboarding();
setInterval(tick,15000);
})();
</script>
